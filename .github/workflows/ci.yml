name: Gridlock CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure Motion+ registry auth
        env:
          MOTION_PLUS_TOKEN: ${{ secrets.MOTION_PLUS_TOKEN }}
        run: |
          if [ -n "$MOTION_PLUS_TOKEN" ]; then
            printf "//api.motion.dev/npm/:_authToken=%s\n" "$MOTION_PLUS_TOKEN" >> "$HOME/.npmrc"
          fi
      - run: npm install
      - if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: origin/${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: npm run check:pr-size
      - run: npm run verify
