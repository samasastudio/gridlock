name: Gridlock CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Configure private Motion+ registry auth (when .npmrc requires api.motion.dev)
        env:
          MOTION_PLUS_TOKEN: ${{ secrets.MOTION_PLUS_TOKEN }}
        run: |
          if grep -q "api.motion.dev" .npmrc 2>/dev/null; then
            CLEAN_TOKEN="$(printf '%s' "$MOTION_PLUS_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^(export[[:space:]]+)?(MOTION_PLUS_TOKEN|MOTION_TOKEN|.*_authToken)=//; s/^["\x27]//; s/["\x27]$//')"
            if printf '%s' "$CLEAN_TOKEN" | grep -qE '^https?://.*[?&]token='; then
              CLEAN_TOKEN="$(printf '%s' "$CLEAN_TOKEN" | sed -E 's/^.*[?&]token=([^&]+).*$/\1/')"
            fi
            if [ -z "$CLEAN_TOKEN" ]; then
              echo "::error::Missing MOTION_PLUS_TOKEN repository secret required by .npmrc (@motionplus registry)."
              exit 1
            fi
            if printf '%s' "$CLEAN_TOKEN" | grep -qE '^(https?:|//)|[[:space:]=]'; then
              echo "::error::Invalid MOTION_PLUS_TOKEN format: set the raw Motion+ registry token from https://motion.dev/dashboard/tokens (no URL, prefix, quotes, or whitespace)."
              exit 1
            fi
            printf "//api.motion.dev/npm/:_authToken=%s\n" "$CLEAN_TOKEN" >> "$HOME/.npmrc"
          fi
      - run: npm install
      - if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: origin/${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: npm run check:pr-size
      - run: npm run verify
